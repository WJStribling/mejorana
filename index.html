// ── STATE ──────────────────────────────────────────────────────────────────
// positions[s]: null=not played, 0=open, 1–8=fret, -1=muted
const state = {
  positions: Array(NS).fill(0),
  selectedRoot: null,
  selectedType: null,
  voicingIndex: 0,
  pov: false,
  manualMode: false,
  listen: false,
  courseLinked: true,
  showNoteLabels: false,
  retro: false,
};

// ── CHORD FINGERING ────────────────────────────────────────────────────────
function computeFingering(intervals, rootPc) {
  const tones = new Set(intervals.map(i => (rootPc + i) % 12));
  let best = null, bestScore = -Infinity;

  for (let w = 0; w <= 6; w++) {
    const pos = Array(NS).fill(null);
    const lo = Math.max(1, w), hi = Math.min(w + 3, NF);

    for (let s = 0; s < NS; s++) {
      const base = STRINGS[s].pc;
      // Check open string
      if (tones.has(base)) { pos[s] = 0; continue; }
      // Check frets in window
      for (let f = lo; f <= hi; f++) {
        if (tones.has((base + f) % 12)) { pos[s] = f; break; }
      }
      // Fallback: open string even outside window
      if (pos[s] === null && tones.has(base)) pos[s] = 0;
    }

    // Enforce A-string course when linked
    if (state.courseLinked && pos[2] !== pos[3]) {
      if (pos[2] === null) pos[2] = pos[3];
      else if (pos[3] === null) pos[3] = pos[2];
      else {
        const pick = Math.min(pos[2], pos[3]);
        if (tones.has((9 + pick) % 12)) { pos[2] = pos[3] = pick; }
        else { pos[2] = pos[3] = Math.max(pos[2], pos[3]); }
      }
    }

    const score = scorePos(pos, tones);
    if (score > bestScore) { bestScore = score; best = [...pos]; }
  }
  return best;
}

function scorePos(pos, tones) {
  const active = pos.filter(f => f !== null);
  const fretted = active.filter(f => f > 0);
  const mutes = pos.filter(f => f === null).length;
  const span = fretted.length > 1 ? Math.max(...fretted) - Math.min(...fretted) : 0;
  const pcs = new Set(active.map((f, i) => {
    const si = pos.indexOf(f); // This is wrong for multiple same values; fix below
    return null;
  }));
  // Rebuild correctly
  const covered = new Set();
  for (let s = 0; s < NS; s++) {
    if (pos[s] !== null && pos[s] >= 0) covered.add((STRINGS[s].pc + pos[s]) % 12);
  }
  const hit = [...covered].filter(p => tones.has(p)).length;
  return hit * 20 - mutes * 6 - span * 3;
}

// ── CHORD DETECTION ────────────────────────────────────────────────────────
function detectChord(activePcs) {
  const pcs = [...new Set(activePcs)];
  if (pcs.length === 0) return null;
  if (pcs.length === 1) return pcName(pcs[0]) + ' (single note)';
  const s = new Set(pcs);

  // Check all types, prefer exact match
  for (const type of Object.keys(CHORD_TYPES)) {
    const ivs = CHORD_TYPES[type].intervals;
    const suf = CHORD_TYPES[type].suffix;
    for (let r = 0; r < 12; r++) {
      const expected = new Set(ivs.map(i => (r + i) % 12));
      if (setsEq(s, expected)) return pcName(r) + suf;
    }
  }
  // Partial match
  for (const type of Object.keys(CHORD_TYPES)) {
    const ivs = CHORD_TYPES[type].intervals;
    const suf = CHORD_TYPES[type].suffix;
    for (let r = 0; r < 12; r++) {
      const expected = ivs.map(i => (r + i) % 12);
      if (pcs.length >= 2 && pcs.every(p => expected.includes(p))) {
        return pcName(r) + suf + ' (partial)';
      }
    }
  }
  return 'Unknown';
}

function setsEq(a, b) {
  if (a.size !== b.size) return false;
  for (const v of a) if (!b.has(v)) return false;
  return true;
}

function pcName(p, useFlat) {
  return noteName(p, useFlat);
}

function fretPc(strIdx, fret) {
  return (STRINGS[strIdx].pc + fret) % 12;
}

// ── BUILD DROPDOWN ─────────────────────────────────────────────────────────
function buildDropdown() {
  const grpIds = { major:'grpMaj', minor:'grpMin', dom7:'grpDom7', maj7:'grpMaj7', min7:'grpMin7' };
  for (const [type, def] of Object.entries(CHORD_TYPES)) {
    const grp = document.getElementById(grpIds[type]);
    grp.label = LANG[currentLang][type] || def.label;
    // Clear existing options
    while (grp.firstChild) grp.removeChild(grp.firstChild);
    SHARP.forEach((root, i) => {
      const dispRoot = currentNotation === 'sol' ? SOL_DISP[i] : DISP[i];
      const label = dispRoot + ' ' + (LANG[currentLang][type] || def.label);
      grp.appendChild(new Option(label, root + ':' + type));
    });
  }
}

// ── BUILD FRETBOARD ────────────────────────────────────────────────────────
const LABELS_W = 140;

function buildFretboard() {
  const pov = state.pov;
  const neckH = NS * CH;
  const vOrder = pov ? [4,3,2,1,0] : [0,1,2,3,4];

  const retro = state.retro;

  // Nut — slightly thicker ivory-coloured bar
  const nutBg = retro
    ? 'linear-gradient(180deg,#ff00ff,#aa00ff,#ff00ff)'
    : '#e9e1cf';
  const nutShadow = retro ? 'box-shadow:0 0 8px #ff00ff,0 0 16px #aa00aa;' : '';
  const nut = `<div style="position:absolute;${pov?'right':'left'}:0;top:0;bottom:0;width:6px;
    background:${nutBg};${nutShadow}z-index:4;pointer-events:none;border-radius:1px;"></div>`;

  // Fret lines — proportional positions, slightly tapered thickness
  let fretLines = '';
  for (let f = 1; f <= NF; f++) {
    const xp = pov ? NECK_W - FRET_X[f] : FRET_X[f];
    const tw = Math.max(1.4, 3.2 - f * 0.2);
    const fretBg = retro
      ? 'linear-gradient(180deg,rgba(0,255,255,.3),rgba(0,255,255,.6),rgba(0,255,255,.3))'
      : 'linear-gradient(90deg,#8f8778,#d6cfc1,#8f8778)';
    const fretGlow = retro ? 'box-shadow:0 0 4px #00ffff;' : '';
    fretLines += `<div style="position:absolute;left:${xp - tw/2}px;top:0;bottom:0;width:${tw}px;
      background:${fretBg};${fretGlow}z-index:2;pointer-events:none;"></div>`;
  }

  // String lines — running the full neck width
  let strLines = '';
  const strColors = ['#ff0066','#ffaa00','#00ff44','#00ccff','#aa44ff'];
  vOrder.forEach((si, row) => {
    const y = (row + 0.5) * CH - THICK[si] / 2;
    const strBg = retro
      ? `${strColors[si]}`
      : '#d3cab8';
    const strGlow = retro ? `box-shadow:0 0 6px ${strColors[si]},0 0 12px ${strColors[si]}40;` : '';
    strLines += `<div style="position:absolute;left:0;right:0;top:${y}px;height:${retro?2:THICK[si]}px;
      background:${strBg};opacity:${retro?1:.85};${strGlow}z-index:2;pointer-events:none;"></div>`;
  });

  // Position markers at 3, 5, 7
  let markers = '';
  [3, 5, 7].forEach(f => {
    const cx = (FRET_X[f-1] + FRET_X[f]) / 2;
    const mx = pov ? NECK_W - cx - 9 : cx - 9;
    const mkBg = retro ? 'rgba(0,255,255,.15)' : 'rgba(233,225,207,.16)';
    const mkShadow = retro ? 'box-shadow:0 0 6px rgba(0,255,255,.2);' : '';
    markers += `<div style="position:absolute;left:${mx}px;top:${neckH/2-9}px;width:18px;height:18px;
      border-radius:50%;background:${mkBg};${mkShadow}z-index:1;pointer-events:none;"></div>`;
  });

  // Clickable fret cells — proportional widths
  let cells = '';
  vOrder.forEach((si, row) => {
    for (let f = 1; f <= NF; f++) {
      const fw = FRET_X[f] - FRET_X[f-1];
      const cx = pov ? NECK_W - FRET_X[f] : FRET_X[f-1];
      cells += `<div id="fc_${si}_${f}" onclick="onFretClick(${si},${f})"
        style="position:absolute;left:${cx}px;top:${row*CH}px;width:${fw}px;height:${CH}px;z-index:5;cursor:pointer;"
        onmouseover="this.style.background='rgba(255,255,255,.05)'"
        onmouseout="this.style.background='transparent'"></div>`;
    }
  });

  // Open-string cells (click cycles: unset → open → muted → unset)
  let openCells = '';
  vOrder.forEach((si, row) => {
    openCells += `<div id="oc_${si}" onclick="onOpenClick(${si})"
      class="open-cell" style="height:${CH}px;width:${OW}px;" title="Tap: open → muted → unset"></div>`;
  });

  // String labels
  let labels = '';
  vOrder.forEach((si) => {
    const str = STRINGS[si];
    const badge = str.course ? `<span class="course-badge">course</span>` : '';
    labels += `<div class="string-label" style="height:${CH}px;">
      <span class="label-note">${str.note}${str.oct}</span>
      <span class="label-desc">${str.desc}</span>${badge}
    </div>`;
  });

  // Fret number row — proportional widths
  let fretNums = '';
  if (pov) {
    for (let f = NF; f >= 1; f--) {
      const fw = FRET_X[f] - FRET_X[f-1];
      fretNums += `<div class="fret-num" style="width:${fw}px;">${f}</div>`;
    }
  } else {
    for (let f = 1; f <= NF; f++) {
      const fw = FRET_X[f] - FRET_X[f-1];
      fretNums += `<div class="fret-num" style="width:${fw}px;">${f}</div>`;
    }
  }

  const openColClass = pov ? 'open-col right-side' : 'open-col';
  const neckClass    = pov ? 'neck pov-mode' : 'neck main-mode';
  const labelsClass  = pov ? 'labels-col left-side' : 'labels-col';
  let neckRow, fretNumsRow;

  if (pov) {
    neckRow = `
      <div class="${labelsClass}" style="height:${neckH}px;">${labels}</div>
      <div class="${neckClass}" style="width:${NECK_W}px;height:${neckH}px;">
        ${nut}${strLines}${fretLines}${markers}${cells}
        <div id="dots" style="position:absolute;inset:0;pointer-events:none;z-index:10;"></div>
      </div>
      <div class="${openColClass}" style="width:${OW}px;">${openCells}</div>`;
    fretNumsRow = `
      <div class="fret-nums-row">
        <div style="width:${LABELS_W}px;flex-shrink:0;"></div>
        ${fretNums}
        <div style="width:${OW}px;flex-shrink:0;"></div>
      </div>`;
  } else {
    neckRow = `
      <div class="${openColClass}" style="width:${OW}px;">${openCells}</div>
      <div class="${neckClass}" style="width:${NECK_W}px;height:${neckH}px;">
        ${nut}${strLines}${fretLines}${markers}${cells}
        <div id="dots" style="position:absolute;inset:0;pointer-events:none;z-index:10;"></div>
      </div>
      <div class="${labelsClass}" style="height:${neckH}px;">${labels}</div>`;
    fretNumsRow = `
      <div class="fret-nums-row">
        <div style="width:${OW}px;flex-shrink:0;"></div>
        ${fretNums}
      </div>`;
  }

  document.getElementById('fretboard-mount').innerHTML = `
    <div class="neck-outer">
      <div class="neck-row">${neckRow}</div>
      ${fretNumsRow}
    </div>`;
}

// ── RENDER ─────────────────────────────────────────────────────────────────
function fretCenterX(fret, pov) {
  // Center of the fret space between fret-1 and fret wires
  const cx = (FRET_X[fret - 1] + FRET_X[fret]) / 2;
  return pov ? NECK_W - cx : cx;
}

function render() {
  const pov = state.pov;
  const dotsEl = document.getElementById('dots');
  dotsEl.innerHTML = '';

  for (let s = 0; s < NS; s++) {
    const oc = document.getElementById(`oc_${s}`);
    if (oc) oc.innerHTML = '';
  }
  const prevOval = document.getElementById('a-course-oval');
  if (prevOval) prevOval.remove();

  const activePcs = [];
  const vOrder = pov ? [4,3,2,1,0] : [0,1,2,3,4];

  // Are both A strings at the same non-null position?
  const aPos = state.positions[2];
  const aCourseLinked = state.courseLinked || (aPos !== null && aPos === state.positions[3]);
  const aCourseActive = aCourseLinked && aPos !== null && aPos === state.positions[3];

  for (let s = 0; s < NS; s++) {
    const pos = state.positions[s];
    if (pos === null) continue;

    // When A-course linked, skip individual rendering — handled below
    if ((s === 2 || s === 3) && aCourseActive) {
      if (s === 2 && pos !== -1) activePcs.push(fretPc(s, pos));
      continue;
    }

    if (pos === -1) {
      const oc = document.getElementById(`oc_${s}`);
      const xColor = state.retro ? '#ff0044' : '#d0705a';
      const xGlow = state.retro ? 'text-shadow:0 0 8px #ff0044;' : '';
      if (oc) oc.innerHTML = `<span style="color:${xColor};font-size:17px;font-weight:900;line-height:1;${xGlow}">✕</span>`;
      continue;
    }

    const p = fretPc(s, pos);
    activePcs.push(p);
    const isRoot = state.selectedRoot !== null && p === state.selectedRoot;
    const retro = state.retro;

    if (pos === 0) {
      const oc = document.getElementById(`oc_${s}`);
      const openBorder = retro
        ? (isRoot ? '#ff00ff' : '#00ffff')
        : (isRoot ? '#d9a441' : '#ece4d6');
      const openBg = retro
        ? (isRoot ? 'rgba(255,0,255,.2)' : 'transparent')
        : (isRoot ? 'rgba(217,164,65,.18)' : 'transparent');
      const openShadow = retro
        ? `box-shadow:0 0 8px ${isRoot?'#ff00ff':'#00ffff'},0 0 16px ${isRoot?'#ff00ff40':'#00ffff40'};`
        : '';
      const noteLblColor = retro
        ? (isRoot ? '#ff00ff' : '#00ffff')
        : (isRoot ? '#d9a441' : '#a0957f');
      const noteLabel = state.showNoteLabels
        ? `<span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
            font-size:9px;font-weight:800;color:${noteLblColor};${retro?'text-shadow:0 0 4px '+noteLblColor+';':''}
            pointer-events:none;line-height:1;">${noteName(fretPc(s, 0))}</span>` : '';
      if (oc) oc.innerHTML = `<div style="position:relative;width:22px;height:22px;border-radius:50%;
        border:2px solid ${openBorder};background:${openBg};${openShadow}">${noteLabel}</div>`;
    } else {
      const vRow = vOrder.indexOf(s);
      const cx = fretCenterX(pos, pov);
      const dot = document.createElement('div');
      dot.style.cssText = `position:absolute;left:${cx - DS/2}px;top:${(vRow+0.5)*CH - DS/2}px;
        width:${DS}px;height:${DS}px;border-radius:50%;display:flex;align-items:center;justify-content:center;`;
      if (retro) {
        const nc = isRoot ? '#ff00ff' : '#00ffff';
        dot.style.cssText += `background:${nc};border:2px solid ${nc};
          box-shadow:0 0 10px ${nc},0 0 20px ${nc},0 0 40px ${nc}40;`;
      } else {
        dot.style.cssText += isRoot
          ? `background:#d9a441;border:none;box-shadow:0 1px 3px rgba(0,0,0,.5),0 0 0 3px rgba(217,164,65,.22);`
          : `background:#ece4d6;border:none;box-shadow:0 1px 3px rgba(0,0,0,.5);`;
      }
      if (state.showNoteLabels) {
        const lbl = document.createElement('span');
        lbl.textContent = noteName(p);
        const lblColor = retro ? '#0a0018' : '#1c1407';
        lbl.style.cssText = `font-size:9px;font-weight:800;color:${lblColor};pointer-events:none;line-height:1;`;
        dot.appendChild(lbl);
      }
      dotsEl.appendChild(dot);
    }
  }

  // ── A-course oval ──────────────────────────────────────────────────────
  if (aCourseActive) {
    const vRow2 = vOrder.indexOf(2);
    const vRow3 = vOrder.indexOf(3);
    const topRow = Math.min(vRow2, vRow3);
    const ovalH = CH + DS;
    const yTop  = (topRow + 1) * CH - ovalH / 2;
    const isRoot = state.selectedRoot !== null && aPos > 0 &&
                   fretPc(2, aPos) === state.selectedRoot;

    const retro = state.retro;

    if (aPos === -1) {
      // Muted course
      const xc = retro ? '#ff0044' : '#d0705a';
      const xg = retro ? 'text-shadow:0 0 8px #ff0044;' : '';
      const ocTop = document.getElementById(`oc_${vOrder[topRow]}`);
      if (ocTop) ocTop.innerHTML = `<span style="color:${xc};font-size:17px;font-weight:900;line-height:1;${xg}">✕</span>`;
      const ocBot = document.getElementById(`oc_${vOrder[topRow+1]}`);
      if (ocBot) ocBot.innerHTML = `<span style="color:${xc};font-size:17px;font-weight:900;line-height:1;${xg}">✕</span>`;

    } else if (aPos === 0) {
      const openColEl = document.querySelector(pov ? '.open-col.right-side' : '.open-col:not(.right-side)');
      if (openColEl) {
        openColEl.style.position = 'relative';
        const ov = document.createElement('div');
        ov.id = 'a-course-oval';
        const oBorder = retro ? (isRoot?'#ff00ff':'#00ffff') : (isRoot?'#d9a441':'#ece4d6');
        const oBg = retro ? (isRoot?'rgba(255,0,255,.2)':'transparent') : (isRoot?'rgba(217,164,65,.18)':'transparent');
        const oShadow = retro ? `0 0 8px ${oBorder},0 0 16px ${oBorder}40` : 'none';
        ov.style.cssText = `position:absolute;left:50%;transform:translateX(-50%);
          top:${yTop}px;width:22px;height:${ovalH}px;border-radius:11px;
          border:2px solid ${oBorder};background:${oBg};
          box-shadow:${oShadow};pointer-events:none;z-index:10;`;
        openColEl.appendChild(ov);
      }

    } else {
      const cx = fretCenterX(aPos, pov);
      const ov = document.createElement('div');
      ov.style.cssText = `position:absolute;left:${cx - DS/2}px;top:${yTop}px;
        width:${DS}px;height:${ovalH}px;border-radius:${DS/2}px;
        display:flex;align-items:center;justify-content:center;`;
      if (retro) {
        const nc = isRoot ? '#ff00ff' : '#00ffff';
        ov.style.cssText += `background:${nc};border:2px solid ${nc};
          box-shadow:0 0 10px ${nc},0 0 20px ${nc},0 0 40px ${nc}40;`;
      } else {
        ov.style.cssText += isRoot
          ? `background:#d9a441;border:none;box-shadow:0 1px 3px rgba(0,0,0,.5),0 0 0 3px rgba(217,164,65,.22);`
          : `background:#ece4d6;border:none;box-shadow:0 1px 3px rgba(0,0,0,.5);`;
      }
      if (state.showNoteLabels) {
        const lbl = document.createElement('span');
        lbl.textContent = noteName(fretPc(2, aPos));
        lbl.style.cssText = `font-size:9px;font-weight:800;color:#1c1407;pointer-events:none;line-height:1;`;
        ov.appendChild(lbl);
      }
      dotsEl.appendChild(ov);
    }
  }

  updateInfo(activePcs);
}

function updateInfo(activePcs) {
  const nameEl   = document.getElementById('chordName');
  const notesEl  = document.getElementById('chordNotes');
  const promptEl = document.getElementById('promptOut');

  if (activePcs.length === 0) {
    nameEl.textContent   = '—';
    notesEl.textContent  = '';
    promptEl.textContent = T('selectOrClick');
    updateTorrente();
    return;
  }

  const allOpen = state.positions.every(p => p === 0);
  let detected;
  if (state.selectedRoot !== null && state.selectedType && !state.manualMode) {
    const rn = pcName(state.selectedRoot);
    const ct = CHORD_TYPES[state.selectedType];
    detected = ct ? rn + ct.suffix : rn;
  } else {
    detected = allOpen ? 'Open' : detectChord(activePcs);
  }
  nameEl.textContent = detected || '—';

  const uNames = [...new Set(activePcs.map(p => pcName(p)))];
  notesEl.textContent = T('notes') + ' ' + uNames.join(' · ');

  const parts = [];
  const aCourseSync = state.positions[2] !== null && state.positions[2] === state.positions[3];
  for (let s = 0; s < NS; s++) {
    const pos = state.positions[s];
    if (pos === null) continue;
    // Combine A-course strings into one entry
    if ((s === 2 || s === 3) && aCourseSync) {
      if (s === 3) continue;
      if (pos === -1)     parts.push(`A course muted`);
      else if (pos === 0) parts.push(`A course open`);
      else                parts.push(`A course fret ${pos} (${pcName(fretPc(s, pos))})`);
      continue;
    }
    const str = STRINGS[s];
    if (pos === -1)     parts.push(`${str.note}${str.oct} muted`);
    else if (pos === 0) parts.push(`${str.note}${str.oct} open`);
    else                parts.push(`${str.note}${str.oct} fret ${pos} (${pcName(fretPc(s, pos))})`);
  }
  promptEl.textContent = detected
    ? `${detected} on mejorana — ${parts.join(', ')}.`
    : `${T('customVoicing')} — ${parts.join(', ')}.`;
  updateTorrente();
}

// ── TORRENTE ───────────────────────────────────────────────────────────────
function updateTorrente() {
  const el = document.getElementById('torrenteDisplay');
  if (!el) return;

  const type = state.selectedType;
  if (state.selectedRoot === null || !type ||
      (type !== 'major' && type !== 'minor') || state.manualMode) {
    el.style.display = 'none';
    return;
  }

  const root   = state.selectedRoot;
  const iv     = (root + 5) % 12;
  const v      = (root + 7) % 12;
  const isMaj  = type === 'major';
  const subType = isMaj ? 'major' : 'minor';

  const tonicN = noteName(root);
  const subN   = noteName(iv);
  const domN   = noteName(v);
  const tonicLbl = isMaj ? tonicN        : `${tonicN}m`;
  const subLbl   = isMaj ? subN          : `${subN}m`;
  const domLbl   = `${domN}7`;

  document.getElementById('torrenteChords').innerHTML = `
    <div class="torrente-chord tonic">
      <div class="torrente-role">I · Tónica</div>
      <div class="torrente-name">${tonicLbl}</div>
    </div>
    <div class="torrente-chord" onclick="loadTorrenteChord(${iv},'${subType}')">
      <div class="torrente-role">IV · Subdominante</div>
      <div class="torrente-name">${subLbl}</div>
    </div>
    <div class="torrente-chord" onclick="loadTorrenteChord(${v},'dom7')">
      <div class="torrente-role">V · Dominante</div>
      <div class="torrente-name">${domLbl}</div>
    </div>`;
  el.style.display = '';
}

function loadTorrenteChord(root, type) {
  const chordKey = SHARP[root] + ':' + type;
  state.selectedRoot = root;
  state.selectedType = type;
  state.voicingIndex = 0;
  state.manualMode   = false;
  document.getElementById('chordSel').value = `${SHARP[root]}:${type}`;
  applyVoicing(chordKey, 0);
  updateHint();
  updateVoicingNav();
  render();
  setTimeout(function() {
    var el = document.getElementById('torrenteDisplay');
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 50);
}

// ── AUDIO ENGINE ───────────────────────────────────────────────────────────
let audioCtx = null;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

// Must be called synchronously inside a user gesture
function resumeAudioSync() {
  const ctx = getAudioCtx();
  if (ctx.state !== 'running') ctx.resume();
  return ctx;
}

function noteFreq(strIdx, fret) {
  const str = STRINGS[strIdx];
  const midi = (str.oct + 1) * 12 + str.pc + fret;
  return 440 * Math.pow(2, (midi - 69) / 12);
}

// Shared output bus — one compressor + limiter for the whole page
let _outBus = null;
function getOutBus(ctx) {
  if (_outBus && _outBus.ctx === ctx) return _outBus.comp;
  // Soft-clip waveshaper (tanh curve) — hard ceiling before speakers
  const limiter = ctx.createWaveShaper();
  const n = 256, curve = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = (i * 2) / n - 1;
    curve[i] = (Math.tanh(2.5 * x) / Math.tanh(2.5)) * 0.92;
  }
  limiter.curve = curve;
  limiter.connect(ctx.destination);

  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -18;
  comp.knee.value      = 10;
  comp.ratio.value     = 6;
  comp.attack.value    = 0.008;
  comp.release.value   = 0.18;
  comp.connect(limiter);

  _outBus = { ctx, comp };
  return comp;
}

function synthNoteNow(ctx, freq, volume, startDelay) {
  const t   = ctx.currentTime + startDelay;
  const dur = 1.8;
  const out = getOutBus(ctx);

  // Synth envelope — punchy attack, sustained pad feel
  const env = ctx.createGain();
  env.gain.setValueAtTime(0, t);
  env.gain.linearRampToValueAtTime(volume * 0.7, t + 0.005);
  env.gain.setValueAtTime(volume * 0.7, t + 0.1);
  env.gain.exponentialRampToValueAtTime(0.001, t + dur);
  env.connect(out);

  // Square wave — classic 8-bit lead
  const sq = ctx.createOscillator();
  sq.type = 'square';
  sq.frequency.setValueAtTime(freq, t);
  // Slight pitch slide down for retro feel
  sq.frequency.exponentialRampToValueAtTime(freq * 0.995, t + 0.15);
  const sqG = ctx.createGain();
  sqG.gain.value = 0.3;
  sq.connect(sqG); sqG.connect(env);
  sq.start(t); sq.stop(t + dur);

  // Sawtooth one octave up — shimmery top
  const saw = ctx.createOscillator();
  saw.type = 'sawtooth';
  saw.frequency.value = freq * 2;
  const sawG = ctx.createGain();
  sawG.gain.value = 0.08;
  saw.connect(sawG); sawG.connect(env);
  saw.start(t); saw.stop(t + dur);

  // Sub oscillator — triangle one octave below
  const sub = ctx.createOscillator();
  sub.type = 'triangle';
  sub.frequency.value = freq / 2;
  const subG = ctx.createGain();
  subG.gain.value = 0.15;
  sub.connect(subG); subG.connect(env);
  sub.start(t); sub.stop(t + dur);

  // Arpeggio sweep — short pitch blip
  const arp = ctx.createOscillator();
  arp.type = 'square';
  arp.frequency.setValueAtTime(freq * 4, t);
  arp.frequency.exponentialRampToValueAtTime(freq, t + 0.06);
  const arpG = ctx.createGain();
  arpG.gain.setValueAtTime(0.12, t);
  arpG.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
  arp.connect(arpG); arpG.connect(env);
  arp.start(t); arp.stop(t + 0.1);
}

function pluckNoteNow(ctx, freq, volume, startDelay) {
  if (state.retro) return synthNoteNow(ctx, freq, volume, startDelay);

  const t   = ctx.currentTime + startDelay;
  const dur = 3.0;
  const out = getOutBus(ctx);

  // Per-note gain — linear 8ms attack to avoid click, then exponential decay
  const env = ctx.createGain();
  env.gain.setValueAtTime(0, t);
  env.gain.linearRampToValueAtTime(volume, t + 0.008);
  env.gain.exponentialRampToValueAtTime(0.001, t + dur);
  env.connect(out);

  // Very soft noise transient — low gain, narrow band, fast fade
  const nSz = Math.floor(ctx.sampleRate * 0.03);
  const nBuf = ctx.createBuffer(1, nSz, ctx.sampleRate);
  const nd = nBuf.getChannelData(0);
  for (let i = 0; i < nSz; i++) nd[i] = (Math.random() * 2 - 1) * (1 - i / nSz);
  const noise = ctx.createBufferSource();
  noise.buffer = nBuf;
  const nbp = ctx.createBiquadFilter();
  nbp.type = 'bandpass'; nbp.frequency.value = freq; nbp.Q.value = 18;
  const ng = ctx.createGain();
  ng.gain.setValueAtTime(0.12, t);
  ng.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
  noise.connect(nbp); nbp.connect(ng); ng.connect(env);
  noise.start(t); noise.stop(t + 0.05);

  // Harmonics — amplitudes normalised so they sum to ~0.65
  const amps = [0.38, 0.14, 0.07, 0.04, 0.02];
  [1, 2, 3, 4, 5].forEach((h, i) => {
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq * h;
    const g = ctx.createGain();
    g.gain.setValueAtTime(amps[i], t);
    osc.connect(g); g.connect(env);
    osc.start(t); osc.stop(t + dur);
  });
}

function pluckNote(freq, volume, startDelay) {
  // ctx already resumed by the calling gesture handler
  const ctx = getAudioCtx();
  pluckNoteNow(ctx, freq, volume || 0.55, startDelay || 0);
}

// ── LISTEN MODE ─────────────────────────────────────────────────────────────
function toggleListen() {
  // resumeAudioSync MUST be called synchronously here, inside the onChange gesture
  resumeAudioSync();
  state.listen = document.getElementById('listenCheck').checked;
  document.getElementById('listenWrap').classList.toggle('on', state.listen);
  document.getElementById('playChordBtn').classList.toggle('visible', state.listen);
}

function playChord() {
  const ctx = resumeAudioSync();
  const strumGroups = [[4], [2, 3], [1], [0]];
  strumGroups.forEach((group, step) => {
    const delay = step * 0.055;
    group.forEach(s => {
      const pos = state.positions[s];
      if (pos === null || pos === -1) return;
      pluckNoteNow(ctx, noteFreq(s, pos), 0.55, delay);
    });
  });
}

// ── INTERACTIONS ───────────────────────────────────────────────────────────
function onFretClick(si, fret) {
  setManualMode();
  const wasOn = state.positions[si] === fret;
  state.positions[si] = wasOn ? null : fret;
  if (state.courseLinked && (si === 2 || si === 3)) {
    state.positions[si === 2 ? 3 : 2] = state.positions[si];
  }
  render();
  if (state.listen && !wasOn) {
    resumeAudioSync();
    pluckNote(noteFreq(si, fret));
  }
}

// Open-cell click cycles: null → open(0) → muted(-1) → null
function onOpenClick(si) {
  setManualMode();
  const cur = state.positions[si];
  const next = cur === null ? 0 : cur === 0 ? -1 : null;
  state.positions[si] = next;
  if (state.courseLinked && (si === 2 || si === 3)) {
    state.positions[si === 2 ? 3 : 2] = next;
  }
  render();
  if (state.listen && next === 0) {
    resumeAudioSync();
    pluckNote(noteFreq(si, 0));
  }
}

function toggleCourse() {
  state.courseLinked = document.getElementById('courseCheck').checked;
  document.getElementById('courseWrap').classList.toggle('on', state.courseLinked);
  if (state.courseLinked) state.positions[3] = state.positions[2];
  render();
}

function toggleNoteLabels() {
  state.showNoteLabels = document.getElementById('noteLabelsCheck').checked;
  document.getElementById('noteLabelsWrap').classList.toggle('on', state.showNoteLabels);
  render();
}

function toggleRetro() {
  state.retro = document.getElementById('retroCheck').checked;
  document.body.classList.toggle('retro', state.retro);
  document.getElementById('retroWrap').classList.toggle('on', state.retro);
  buildFretboard();
  updateVoicingNav();
  render();
}

function toggleTuner() {
  const panel = document.getElementById('tunerPanel');
  const btn   = document.getElementById('tunerBtn');
  const isOpen = panel.classList.toggle('visible');
  btn.classList.toggle('active', isOpen);
  if (!isOpen) stopTunerMic();
}

// ── CUSTOM CHORDS ───────────────────────────────────────────────────────────
const STORAGE_KEY = 'mejorana_custom_chords';

function loadCustomChords() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch(e) { return []; }
}

function saveCustomChords(list) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}

function rebuildCustomDropdown() {
  const sel = document.getElementById('customSel');
  // Remove all options except the placeholder
  while (sel.options.length > 1) sel.remove(1);
  const list = loadCustomChords();
  list.forEach((chord, i) => {
    sel.appendChild(new Option(chord.name, String(i)));
  });
}

function showSaveInput() {
  document.getElementById('saveNameWrap').classList.add('visible');
  document.getElementById('saveNameInput').focus();
}

function hideSaveInput() {
  document.getElementById('saveNameWrap').classList.remove('visible');
  document.getElementById('saveNameInput').value = '';
}

function confirmSaveChord() {
  const name = document.getElementById('saveNameInput').value.trim();
  if (!name) return;
  const list = loadCustomChords();
  list.push({ name, positions: [...state.positions] });
  saveCustomChords(list);
  rebuildCustomDropdown();
  hideSaveInput();
  // Select the newly saved chord in the dropdown
  const sel = document.getElementById('customSel');
  sel.value = String(list.length - 1);
  document.getElementById('deleteCustomBtn').style.display = '';
}

function onCustomSelect(value) {
  const del = document.getElementById('deleteCustomBtn');
  if (value === '') { del.style.display = 'none'; return; }
  del.style.display = '';
  const list = loadCustomChords();
  const chord = list[parseInt(value, 10)];
  if (!chord) return;
  state.positions = [...chord.positions];
  state.selectedRoot = null;
  state.selectedType = null;
  state.manualMode = false;
  document.getElementById('chordSel').value = '';
  updateHint();
  render();
}

function deleteCustomChord() {
  const sel = document.getElementById('customSel');
  const idx = parseInt(sel.value, 10);
  if (isNaN(idx)) return;
  const list = loadCustomChords();
  list.splice(idx, 1);
  saveCustomChords(list);
  rebuildCustomDropdown();
  sel.value = '';
  document.getElementById('deleteCustomBtn').style.display = 'none';
}

// ── CHORD SEQUENCES ───────────────────────────────────────────────────────
const SEQ_STORAGE_KEY = 'mejorana_chord_sequences';
let currentSequence = [];

function seqAddChord() {
  const name = document.getElementById('chordName').textContent;
  if (!name || name === '—') return;
  currentSequence.push({ name, positions: [...state.positions] });
  renderSequence();
}

function seqRemoveChord(index) {
  currentSequence.splice(index, 1);
  renderSequence();
}

function seqMoveChord(index, dir) {
  const target = index + dir;
  if (target < 0 || target >= currentSequence.length) return;
  const tmp = currentSequence[index];
  currentSequence[index] = currentSequence[target];
  currentSequence[target] = tmp;
  renderSequence();
}

function seqClear() {
  currentSequence = [];
  renderSequence();
}

function renderSequence() {
  const container = document.getElementById('seqThumbs');
  container.innerHTML = '';
  const exportBtn = document.getElementById('seqExportBtnWrap');
  if (exportBtn) exportBtn.style.display = currentSequence.length > 0 ? '' : 'none';
  const TW = 80, TH = 60;
  currentSequence.forEach((chord, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'seq-chord';

    const num = document.createElement('div');
    num.className = 'seq-chord-num';
    num.textContent = (i + 1);
    wrap.appendChild(num);

    const c = document.createElement('canvas');
    c.width = TW * 2; c.height = TH * 2;
    c.style.width = TW + 'px'; c.style.height = TH + 'px';
    c.className = 'voicing-thumb';
    c.onclick = () => seqLoadChord(i);
    drawThumb(c, chord.positions);
    wrap.appendChild(c);

    const label = document.createElement('div');
    label.className = 'seq-chord-name';
    label.textContent = chord.name;
    label.title = chord.name;
    wrap.appendChild(label);

    const actions = document.createElement('div');
    actions.className = 'seq-chord-actions';
    const leftBtn = document.createElement('button');
    leftBtn.className = 'seq-arrow';
    leftBtn.innerHTML = '&larr;';
    leftBtn.onclick = (e) => { e.stopPropagation(); seqMoveChord(i, -1); };
    const rightBtn = document.createElement('button');
    rightBtn.className = 'seq-arrow';
    rightBtn.innerHTML = '&rarr;';
    rightBtn.onclick = (e) => { e.stopPropagation(); seqMoveChord(i, 1); };
    const removeBtn = document.createElement('button');
    removeBtn.className = 'seq-remove';
    removeBtn.innerHTML = '&times;';
    removeBtn.onclick = (e) => { e.stopPropagation(); seqRemoveChord(i); };
    actions.appendChild(leftBtn);
    actions.appendChild(rightBtn);
    actions.appendChild(removeBtn);
    wrap.appendChild(actions);

    container.appendChild(wrap);
  });
}

function seqLoadChord(index) {
  const chord = currentSequence[index];
  if (!chord) return;
  state.positions = [...chord.positions];
  state.selectedRoot = null;
  state.selectedType = null;
  state.manualMode = true;
  document.getElementById('chordSel').value = '';
  updateVoicingNav();
  render();
}

function loadSeqList() {
  return JSON.parse(localStorage.getItem(SEQ_STORAGE_KEY) || '[]');
}

function saveSeqList(list) {
  localStorage.setItem(SEQ_STORAGE_KEY, JSON.stringify(list));
}

function rebuildSeqDropdown() {
  const sel = document.getElementById('seqSel');
  while (sel.options.length > 1) sel.remove(1);
  const list = loadSeqList();
  list.forEach((seq, i) => {
    sel.appendChild(new Option(seq.name + ' (' + seq.chords.length + ')', i));
  });
}

function showSeqSaveInput() {
  document.getElementById('seqSaveNameWrap').classList.add('visible');
  document.getElementById('seqSaveNameInput').focus();
}

function hideSeqSaveInput() {
  document.getElementById('seqSaveNameWrap').classList.remove('visible');
  document.getElementById('seqSaveNameInput').value = '';
}

function confirmSaveSeq() {
  const name = document.getElementById('seqSaveNameInput').value.trim();
  if (!name || currentSequence.length === 0) return;
  const list = loadSeqList();
  list.push({ name, chords: [...currentSequence] });
  saveSeqList(list);
  rebuildSeqDropdown();
  hideSeqSaveInput();
}

function onSeqSelect(value) {
  if (value === '') {
    document.getElementById('deleteSeqBtn').style.display = 'none';
    return;
  }
  const list = loadSeqList();
  const seq = list[parseInt(value, 10)];
  if (!seq) return;
  currentSequence = [...seq.chords];
  renderSequence();
  document.getElementById('deleteSeqBtn').style.display = '';
}

function deleteSeq() {
  const sel = document.getElementById('seqSel');
  const idx = parseInt(sel.value, 10);
  if (isNaN(idx)) return;
  const list = loadSeqList();
  list.splice(idx, 1);
  saveSeqList(list);
  rebuildSeqDropdown();
  sel.value = '';
  document.getElementById('deleteSeqBtn').style.display = 'none';
}

function setManualMode() {
  if (!state.manualMode) {
    document.getElementById('chordSel').value = '';
    state.selectedRoot = null;
    state.selectedType = null;
    state.manualMode = true;
  }
  const pov = state.pov;
  document.getElementById('modeHint').textContent =
    pov
      ? 'Manual mode (POV) — click frets to toggle notes'
      : 'Manual mode — click frets to toggle notes';
}

function onChordSelect(value) {
  if (!value) { clearAll(); return; }
  const [rootName, type] = value.split(':');
  const root = SHARP.indexOf(rootName);
  state.selectedRoot = root;
  state.selectedType = type;
  state.manualMode = false;
  state.voicingIndex = 0;

  applyVoicing(rootName + ':' + type, 0);
  updateHint();
  updateVoicingNav();
  render();
}

function applyVoicing(chordKey, idx) {
  const voicings = CHORD_VOICINGS[chordKey];
  if (voicings && voicings[idx] !== undefined) {
    state.positions = voicings[idx].map(p => p === null ? 0 : p);
  } else if (!voicings) {
    const [rootName, type] = chordKey.split(':');
    const root = SHARP.indexOf(rootName);
    const ivs = CHORD_TYPES[type].intervals;
    state.positions = computeFingering(ivs, root);
  }
}

function nextVoicing() {
  if (state.selectedRoot === null || !state.selectedType) return;
  const chordKey = SHARP[state.selectedRoot] + ':' + state.selectedType;
  const voicings = CHORD_VOICINGS[chordKey];
  if (!voicings || voicings.length <= 1) return;
  state.voicingIndex = (state.voicingIndex + 1) % voicings.length;
  applyVoicing(chordKey, state.voicingIndex);
  updateVoicingNav();
  render();
}

function prevVoicing() {
  if (state.selectedRoot === null || !state.selectedType) return;
  const chordKey = SHARP[state.selectedRoot] + ':' + state.selectedType;
  const voicings = CHORD_VOICINGS[chordKey];
  if (!voicings || voicings.length <= 1) return;
  state.voicingIndex = (state.voicingIndex - 1 + voicings.length) % voicings.length;
  applyVoicing(chordKey, state.voicingIndex);
  updateVoicingNav();
  render();
}

function selectVoicing(idx) {
  if (state.selectedRoot === null || !state.selectedType) return;
  const chordKey = SHARP[state.selectedRoot] + ':' + state.selectedType;
  const voicings = CHORD_VOICINGS[chordKey];
  if (!voicings || idx >= voicings.length) return;
  state.voicingIndex = idx;
  applyVoicing(chordKey, idx);
  updateVoicingNav();
  render();
}

function updateVoicingNav() {
  const nav = document.getElementById('voicingNav');
  if (!nav) return;
  if (state.selectedRoot === null || !state.selectedType || state.manualMode) {
    nav.style.display = 'none';
    return;
  }
  const chordKey = SHARP[state.selectedRoot] + ':' + state.selectedType;
  const voicings = CHORD_VOICINGS[chordKey];
  if (!voicings || voicings.length <= 1) {
    nav.style.display = 'none';
    return;
  }
  nav.style.display = '';
  document.getElementById('voicingLabel').textContent =
    T('voicing') + ' ' + (state.voicingIndex + 1) + ' ' + T('voicingOf') + ' ' + voicings.length;

  const thumbs = document.getElementById('voicingThumbs');
  thumbs.innerHTML = '';
  const TW = 80, TH = 60;
  voicings.forEach((v, i) => {
    const c = document.createElement('canvas');
    c.width = TW * 2; c.height = TH * 2;
    c.style.width = TW + 'px'; c.style.height = TH + 'px';
    c.className = 'voicing-thumb' + (i === state.voicingIndex ? ' active' : '');
    c.onclick = () => selectVoicing(i);
    drawThumb(c, v);
    thumbs.appendChild(c);
  });
}

function drawThumb(canvas, positions) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const isRetro = state.retro;
  const pad = { left: 18, right: 8, top: 10, bottom: 10 };
  const neckW = W - pad.left - pad.right;
  const neckH = H - pad.top - pad.bottom;
  const fretW = neckW / NF;
  const strGap = neckH / (NS - 1);

  // Background
  ctx.fillStyle = isRetro ? '#0a0015' : '#221e19';
  ctx.fillRect(0, 0, W, H);

  // Neck
  ctx.fillStyle = isRetro ? '#110022' : '#3b2418';
  ctx.fillRect(pad.left, pad.top, neckW, neckH);

  // Nut
  ctx.fillStyle = isRetro ? '#ff00ff' : '#e9e1cf';
  ctx.fillRect(pad.left - 3, pad.top, 3, neckH);

  // Frets
  ctx.strokeStyle = isRetro ? '#00ffff33' : '#7d7466';
  ctx.lineWidth = 1;
  for (let f = 1; f <= NF; f++) {
    const x = pad.left + f * fretW;
    ctx.beginPath(); ctx.moveTo(x, pad.top); ctx.lineTo(x, pad.top + neckH); ctx.stroke();
  }

  // Strings
  ctx.lineWidth = 1;
  for (let s = 0; s < NS; s++) {
    const y = pad.top + s * strGap;
    ctx.strokeStyle = isRetro ?
      ['#ff69b4','#ff8c00','#00ff41','#00ffff','#bf5fff'][s] :
      '#b5ac9b';
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(pad.left + neckW, y); ctx.stroke();
  }

  // Dots
  const r = 6;
  positions.forEach((p, s) => {
    const y = pad.top + s * strGap;
    if (p === null || p === 0) {
      // Open circle
      ctx.strokeStyle = isRetro ? '#00ffff' : '#a0957f';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(pad.left - 10, y, r * 0.6, 0, Math.PI * 2); ctx.stroke();
    } else if (p === -1) {
      // Muted X
      ctx.strokeStyle = isRetro ? '#ff004488' : '#6f6656';
      ctx.lineWidth = 1.5;
      const cx = pad.left - 10;
      const sz = r * 0.5;
      ctx.beginPath(); ctx.moveTo(cx - sz, y - sz); ctx.lineTo(cx + sz, y + sz); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx + sz, y - sz); ctx.lineTo(cx - sz, y + sz); ctx.stroke();
    } else {
      // Fretted dot
      const x = pad.left + (p - 0.5) * fretW;
      ctx.fillStyle = isRetro ? '#ff00ff' : '#d9a441';
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
  });
}

// Backwards compat alias

function togglePOV() { setPOV(!state.pov); }

function setPOV(on) {
  if (state.pov === on) return;
  state.pov = on;
  document.getElementById('viewLap').classList.toggle('active', !on);
  document.getElementById('viewPlayer').classList.toggle('active', on);
  buildFretboard();
  render();
  updateHint();
  // In player view fret 1 sits on the right, so start narrow screens scrolled there
  const scroller = document.querySelector('.fretboard-scroll');
  scroller.scrollLeft = on ? scroller.scrollWidth : 0;
}

function clearAll() {
  state.positions = Array(NS).fill(0);
  state.selectedRoot = null;
  state.selectedType = null;
  state.voicingIndex = 0;
  state.manualMode = false;
  document.getElementById('chordSel').value = '';
  updateHint();
  updateVoicingNav();
  render();
}

function updateHint() {
  const pov = state.pov;
  const manual = state.manualMode;
  let hint;
  if (pov && manual)        hint = T('hintPOVManual');
  else if (pov && !manual)  hint = T('hintPOV');
  else if (!pov && manual)  hint = T('hintMainManual');
  else                      hint = T('hintMain');
  document.getElementById('modeHint').textContent = hint;
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function() { el.classList.remove('show'); }, 2000);
}

function exportChordImage() {
  const retro = state.retro;
  const pov = state.pov;
  const vOrder = pov ? [4,3,2,1,0] : [0,1,2,3,4];
  const scale = 2; // high-res export
  const neckW = NECK_W, neckH = NS * CH;
  const openW = OW, labelW = 80;
  const headerH = 60, footerH = 40, fretNumH = 24;
  const totalW = openW + neckW + labelW;
  const totalH = headerH + neckH + fretNumH + footerH;

  const c = document.createElement('canvas');
  c.width = totalW * scale;
  c.height = totalH * scale;
  const ctx = c.getContext('2d');
  ctx.scale(scale, scale);

  // Background
  ctx.fillStyle = retro ? '#0a0018' : '#12100d';
  ctx.fillRect(0, 0, totalW, totalH);

  // Grid overlay for retro
  if (retro) {
    ctx.strokeStyle = 'rgba(20,0,50,.6)';
    ctx.lineWidth = 0.5;
    for (let x = 0; x < totalW; x += 20) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,totalH); ctx.stroke(); }
    for (let y = 0; y < totalH; y += 20) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(totalW,y); ctx.stroke(); }
  }

  // Header — chord name
  const chordName = document.getElementById('chordName').textContent;
  const chordNotes = document.getElementById('chordNotes').textContent;
  ctx.textAlign = 'center';
  if (retro) {
    ctx.font = 'bold 22px "Press Start 2P", monospace';
    ctx.fillStyle = '#ff00ff';
    ctx.shadowColor = '#ff00ff'; ctx.shadowBlur = 12;
  } else {
    ctx.font = 'bold 26px Inter, -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.fillStyle = '#d9a441';
    ctx.shadowColor = 'rgba(0,0,0,0)'; ctx.shadowBlur = 16;
  }
  ctx.fillText(chordName, totalW / 2, 32);
  ctx.shadowBlur = 0;
  if (retro) {
    ctx.font = '8px "Press Start 2P", monospace';
    ctx.fillStyle = '#00ffff';
  } else {
    ctx.font = '11px Inter, -apple-system, sans-serif';
    ctx.fillStyle = '#a0957f';
  }
  ctx.fillText(chordNotes, totalW / 2, 50);

  // Offsets
  const ox = pov ? labelW : openW;
  const oy = headerH;

  // Neck background
  if (retro) {
    ctx.fillStyle = '#080020';
    ctx.strokeStyle = '#4400aa';
  } else {
    ctx.fillStyle = '#4a2d1d';
    ctx.strokeStyle = '#23150d';
  }
  ctx.fillRect(ox, oy, neckW, neckH);
  ctx.lineWidth = 2;
  ctx.strokeRect(ox, oy, neckW, neckH);

  // Nut
  const nutX = pov ? ox + neckW - 3 : ox;
  if (retro) {
    ctx.fillStyle = '#ff00ff';
    ctx.shadowColor = '#ff00ff'; ctx.shadowBlur = 6;
  } else {
    ctx.fillStyle = '#e9e1cf';
    ctx.shadowBlur = 0;
  }
  ctx.fillRect(nutX, oy, 6, neckH);
  ctx.shadowBlur = 0;

  // Fret lines
  for (let f = 1; f <= NF; f++) {
    const xp = pov ? neckW - FRET_X[f] : FRET_X[f];
    const tw = Math.max(1.4, 3.2 - f * 0.2);
    if (retro) {
      ctx.strokeStyle = 'rgba(0,255,255,.5)';
      ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 3;
    } else {
      ctx.strokeStyle = 'rgba(220,210,170,.6)';
      ctx.shadowBlur = 0;
    }
    ctx.lineWidth = tw;
    ctx.beginPath();
    ctx.moveTo(ox + xp, oy);
    ctx.lineTo(ox + xp, oy + neckH);
    ctx.stroke();
  }
  ctx.shadowBlur = 0;

  // Strings
  const strColors = ['#ff0066','#ffaa00','#00ff44','#00ccff','#aa44ff'];
  vOrder.forEach((si, row) => {
    const y = oy + (row + 0.5) * CH;
    if (retro) {
      ctx.strokeStyle = strColors[si];
      ctx.shadowColor = strColors[si]; ctx.shadowBlur = 4;
      ctx.lineWidth = 2;
    } else {
      ctx.strokeStyle = 'rgba(200,195,170,.7)';
      ctx.shadowBlur = 0;
      ctx.lineWidth = THICK[si];
    }
    ctx.beginPath();
    ctx.moveTo(ox, y);
    ctx.lineTo(ox + neckW, y);
    ctx.stroke();
  });
  ctx.shadowBlur = 0;

  // Position markers
  ctx.lineWidth = 1;
  [3, 5, 7].forEach(f => {
    const cxf = (FRET_X[f-1] + FRET_X[f]) / 2;
    const mx = pov ? neckW - cxf : cxf;
    ctx.beginPath();
    ctx.arc(ox + mx, oy + neckH / 2, 9, 0, Math.PI * 2);
    ctx.fillStyle = retro ? 'rgba(0,255,255,.1)' : 'rgba(255,248,200,.1)';
    ctx.fill();
  });

  // Dots
  const aCourseActive = state.courseLinked && state.positions[2] !== null && state.positions[2] === state.positions[3];

  for (let s = 0; s < NS; s++) {
    const pos = state.positions[s];
    if (pos === null) continue;
    if ((s === 2 || s === 3) && aCourseActive) continue;
    const vRow = vOrder.indexOf(s);
    const cy = oy + (vRow + 0.5) * CH;
    const p = (pos > 0) ? fretPc(s, pos) : (pos === 0 ? fretPc(s, 0) : -1);
    const isRoot = state.selectedRoot !== null && p === state.selectedRoot;

    if (pos === -1) {
      // Muted X
      const xPos = pov ? ox + neckW + openW/2 : openW/2;
      ctx.font = 'bold 17px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = retro ? '#ff0044' : '#d0705a';
      ctx.fillText('✕', xPos, cy + 6);
      continue;
    }

    if (pos === 0) {
      // Open circle
      const oPos = pov ? ox + neckW + openW/2 : openW/2;
      ctx.beginPath();
      ctx.arc(oPos, cy, 11, 0, Math.PI * 2);
      ctx.lineWidth = 2;
      if (retro) {
        ctx.strokeStyle = isRoot ? '#ff00ff' : '#00ffff';
        ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 6;
      } else {
        ctx.strokeStyle = isRoot ? '#d9a441' : '#ece4d6';
        ctx.shadowBlur = 0;
      }
      ctx.fillStyle = retro ? (isRoot?'rgba(255,0,255,.15)':'transparent') : (isRoot?'rgba(217,164,65,.15)':'transparent');
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;
    } else {
      // Fretted dot
      const fcx = (FRET_X[pos-1] + FRET_X[pos]) / 2;
      const dx = ox + (pov ? neckW - fcx : fcx);
      ctx.beginPath();
      ctx.arc(dx, cy, DS/2, 0, Math.PI * 2);
      if (retro) {
        const nc = isRoot ? '#ff00ff' : '#00ffff';
        ctx.fillStyle = nc;
        ctx.shadowColor = nc; ctx.shadowBlur = 14;
      } else {
        ctx.fillStyle = isRoot ? '#d9a441' : '#ece4d6';
        ctx.shadowBlur = 0;
      }
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.lineWidth = 2;
      ctx.strokeStyle = retro ? 'transparent' : (isRoot ? 'rgba(0,0,0,.25)' : 'rgba(0,0,0,.25)');
      ctx.stroke();
    }
  }

  // A-course oval
  if (aCourseActive) {
    const aPos = state.positions[2];
    const vRow2 = vOrder.indexOf(2);
    const vRow3 = vOrder.indexOf(3);
    const topRow = Math.min(vRow2, vRow3);
    const isRoot = state.selectedRoot !== null && aPos > 0 && fretPc(2, aPos) === state.selectedRoot;

    if (aPos === -1) {
      const xPos = pov ? ox + neckW + openW/2 : openW/2;
      ctx.font = 'bold 17px sans-serif'; ctx.textAlign = 'center';
      ctx.fillStyle = retro ? '#ff0044' : '#d0705a';
      ctx.fillText('✕', xPos, oy + (topRow+0.5)*CH + 6);
      ctx.fillText('✕', xPos, oy + (topRow+1.5)*CH + 6);
    } else if (aPos === 0) {
      const oPos = pov ? ox + neckW + openW/2 : openW/2;
      const ovalTop = oy + (topRow+0.5)*CH - (CH+DS)/2 + CH/2;
      ctx.beginPath();
      const ovalRx = 11, ovalRy = (CH+DS)/2;
      ctx.ellipse(oPos, ovalTop + ovalRy, ovalRx, ovalRy, 0, 0, Math.PI*2);
      ctx.lineWidth = 2;
      if (retro) { ctx.strokeStyle = isRoot?'#ff00ff':'#00ffff'; ctx.shadowColor=ctx.strokeStyle; ctx.shadowBlur=6; }
      else { ctx.strokeStyle = isRoot?'#d9a441':'#ece4d6'; }
      ctx.fillStyle = 'transparent'; ctx.stroke();
      ctx.shadowBlur = 0;
    } else {
      const fcx = (FRET_X[aPos-1] + FRET_X[aPos]) / 2;
      const dx = ox + (pov ? neckW - fcx : fcx);
      const ovalTop = oy + (topRow+0.5)*CH;
      const ovalRx = DS/2, ovalRy = (CH+DS)/2;
      ctx.beginPath();
      ctx.ellipse(dx, ovalTop + CH/2, ovalRx, ovalRy, 0, 0, Math.PI*2);
      if (retro) {
        const nc = isRoot?'#ff00ff':'#00ffff';
        ctx.fillStyle = nc; ctx.shadowColor=nc; ctx.shadowBlur=14;
      } else {
        ctx.fillStyle = isRoot?'#d9a441':'#ece4d6';
      }
      ctx.fill(); ctx.shadowBlur=0;
    }
  }

  // Fret numbers
  ctx.textAlign = 'center';
  if (retro) { ctx.font = '7px "Press Start 2P", monospace'; ctx.fillStyle = '#6644aa'; }
  else { ctx.font = '10px Inter, -apple-system, sans-serif'; ctx.fillStyle = '#6f6656'; }
  for (let f = 1; f <= NF; f++) {
    const fcx = (FRET_X[f-1] + FRET_X[f]) / 2;
    const fx = ox + (pov ? neckW - fcx : fcx);
    ctx.fillText(f, fx, oy + neckH + fretNumH - 6);
  }

  // String labels
  ctx.textAlign = pov ? 'right' : 'left';
  if (retro) { ctx.font = '7px "Press Start 2P", monospace'; ctx.fillStyle = '#00ffff'; }
  else { ctx.font = '12px Inter, -apple-system, sans-serif'; ctx.fillStyle = '#ece4d6'; }
  vOrder.forEach((si, row) => {
    const ly = oy + (row + 0.5) * CH + 4;
    const lx = pov ? labelW - 8 : ox + neckW + 12;
    ctx.fillText(STRINGS[si].note + STRINGS[si].oct, lx, ly);
  });

  // Footer — watermark
  ctx.textAlign = 'center';
  if (retro) { ctx.font = '6px "Press Start 2P", monospace'; ctx.fillStyle = '#4422aa'; }
  else { ctx.font = '9px Inter, -apple-system, sans-serif'; ctx.fillStyle = '#6f6656'; }
  ctx.fillText('Mejorana Chord Visualizer', totalW / 2, totalH - 12);

  // Export as JPEG
  c.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const name = chordName.replace(/[^a-zA-Z0-9#]/g, '_') || 'chord';
    a.href = url;
    a.download = `mejorana_${name}.jpg`;
    a.click();
    URL.revokeObjectURL(url);
    showToast(T('exported'));
  }, 'image/jpeg', 0.95);
}

// ── EXPORT SEQUENCE ───────────────────────────────────────────────────────
function exportSequenceImage() {
  if (currentSequence.length === 0) return;
  const retro = state.retro;
  const scale = 2;
  const chordW = 120, chordH = 90;
  const pad = { left: 20, right: 20, top: 10, bottom: 10 };
  const thumbNeckW = chordW - pad.left - pad.right;
  const thumbNeckH = chordH - pad.top - pad.bottom;
  const fretW = thumbNeckW / NF;
  const strGap = thumbNeckH / (NS - 1);

  const gapX = 16;
  const labelH = 22, numH = 16;
  const headerH = 50, footerH = 30;
  const cardW = chordW + gapX;
  const maxPerRow = 8;
  const cols = Math.min(currentSequence.length, maxPerRow);
  const rows = Math.ceil(currentSequence.length / maxPerRow);
  const rowH = numH + chordH + labelH + 12;
  const totalW = cols * cardW - gapX + 40;
  const totalH = headerH + rows * rowH + footerH;

  const c = document.createElement('canvas');
  c.width = totalW * scale;
  c.height = totalH * scale;
  const ctx = c.getContext('2d');
  ctx.scale(scale, scale);

  // Background
  ctx.fillStyle = retro ? '#0a0018' : '#12100d';
  ctx.fillRect(0, 0, totalW, totalH);

  if (retro) {
    ctx.strokeStyle = 'rgba(20,0,50,.6)';
    ctx.lineWidth = 0.5;
    for (let x = 0; x < totalW; x += 20) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,totalH); ctx.stroke(); }
    for (let y = 0; y < totalH; y += 20) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(totalW,y); ctx.stroke(); }
  }

  // Header
  ctx.textAlign = 'center';
  if (retro) {
    ctx.font = 'bold 14px "Press Start 2P", monospace';
    ctx.fillStyle = '#ff00ff';
    ctx.shadowColor = '#ff00ff'; ctx.shadowBlur = 10;
  } else {
    ctx.font = 'bold 20px Inter, -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.fillStyle = '#d9a441';
    ctx.shadowColor = 'rgba(0,0,0,0)'; ctx.shadowBlur = 12;
  }
  // Use saved sequence name if loaded, otherwise generic
  const seqSel = document.getElementById('seqSel');
  const seqTitle = (seqSel.value !== '' && seqSel.selectedOptions[0])
    ? seqSel.selectedOptions[0].text.replace(/\s*\(\d+\)$/, '')
    : 'Chord Sequence';
  ctx.fillText(seqTitle, totalW / 2, 32);
  ctx.shadowBlur = 0;

  // Draw each chord
  currentSequence.forEach((chord, i) => {
    const row = Math.floor(i / maxPerRow);
    const col = i % maxPerRow;
    const rowChords = Math.min(currentSequence.length - row * maxPerRow, maxPerRow);
    const rowW = rowChords * cardW - gapX;
    const rowOffX = (totalW - rowW) / 2;
    const bx = rowOffX + col * cardW;
    const by = headerH + row * rowH;

    // Number
    ctx.textAlign = 'center';
    ctx.font = retro ? '7px "Press Start 2P", monospace' : '10px Inter, -apple-system, sans-serif';
    ctx.fillStyle = retro ? '#8866bb' : '#5a4a30';
    ctx.fillText((i + 1), bx + chordW / 2, by + numH - 3);

    // Thumb background
    const tx = bx, ty = by + numH;
    ctx.fillStyle = retro ? '#0a0015' : '#221e19';
    ctx.fillRect(tx, ty, chordW, chordH);
    ctx.strokeStyle = retro ? '#4400aa' : '#3a2a10';
    ctx.lineWidth = 1;
    ctx.strokeRect(tx, ty, chordW, chordH);

    // Neck
    const nx = tx + pad.left, ny = ty + pad.top;
    ctx.fillStyle = retro ? '#110022' : '#3b2418';
    ctx.fillRect(nx, ny, thumbNeckW, thumbNeckH);

    // Nut
    ctx.fillStyle = retro ? '#ff00ff' : '#e9e1cf';
    ctx.fillRect(nx - 3, ny, 3, thumbNeckH);

    // Frets
    ctx.strokeStyle = retro ? '#00ffff33' : '#7d7466';
    ctx.lineWidth = 1;
    for (let f = 1; f <= NF; f++) {
      const fx = nx + f * fretW;
      ctx.beginPath(); ctx.moveTo(fx, ny); ctx.lineTo(fx, ny + thumbNeckH); ctx.stroke();
    }

    // Strings
    const strColors = ['#ff69b4','#ff8c00','#00ff41','#00ffff','#bf5fff'];
    for (let s = 0; s < NS; s++) {
      const sy = ny + s * strGap;
      ctx.strokeStyle = retro ? strColors[s] : '#b5ac9b';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(nx, sy); ctx.lineTo(nx + thumbNeckW, sy); ctx.stroke();
    }

    // Dots
    const dotR = 7;
    chord.positions.forEach((p, s) => {
      const sy = ny + s * strGap;
      if (p === null || p === 0) {
        ctx.strokeStyle = retro ? '#00ffff' : '#a0957f';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(nx - 10, sy, dotR * 0.6, 0, Math.PI * 2); ctx.stroke();
      } else if (p === -1) {
        ctx.strokeStyle = retro ? '#ff004488' : '#6f6656';
        ctx.lineWidth = 1.5;
        const cx = nx - 10, sz = dotR * 0.5;
        ctx.beginPath(); ctx.moveTo(cx - sz, sy - sz); ctx.lineTo(cx + sz, sy + sz); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx + sz, sy - sz); ctx.lineTo(cx - sz, sy + sz); ctx.stroke();
      } else {
        const dx = nx + (p - 0.5) * fretW;
        ctx.fillStyle = retro ? '#ff00ff' : '#d9a441';
        ctx.beginPath(); ctx.arc(dx, sy, dotR, 0, Math.PI * 2); ctx.fill();
      }
    });

    // Chord name
    ctx.textAlign = 'center';
    ctx.font = retro ? '8px "Press Start 2P", monospace' : 'bold 12px Inter, -apple-system, sans-serif';
    ctx.fillStyle = retro ? '#00ffff' : '#ece4d6';
    ctx.fillText(chord.name, bx + chordW / 2, ty + chordH + labelH - 6);
  });

  // Footer
  ctx.textAlign = 'center';
  ctx.font = retro ? '6px "Press Start 2P", monospace' : '9px Inter, -apple-system, sans-serif';
  ctx.fillStyle = retro ? '#4422aa' : '#6f6656';
  ctx.fillText('Mejorana Chord Visualizer', totalW / 2, totalH - 10);

  c.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const fname = seqTitle.replace(/[^a-zA-Z0-9]/g, '_') || 'sequence';
    a.href = url;
    a.download = `mejorana_${fname}.jpg`;
    a.click();
    URL.revokeObjectURL(url);
    showToast(T('exported'));
  }, 'image/jpeg', 0.95);
}

// ── TUNER ──────────────────────────────────────────────────────────────────
const TUNER_STRINGS = [
  { label: '1a — Mi (E4)',  freq: 329.63 },
  { label: '2a — Si (B3)',  freq: 246.94 },
  { label: '3a — La (A3)', freq: 220.00 },
  { label: '4a — La (A4)', freq: 440.00 },
  { label: '5a — Re (D4)', freq: 293.66 },
];
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

let tunerStream = null;
let tunerSource = null;
let tunerAnalyser = null;
let tunerRaf = null;
let tunerRunning = false;

function detectPitch(buf, sampleRate) {
  const half = Math.floor(buf.length / 2);
  const minLag = Math.floor(sampleRate / 1100);
  const maxLag = Math.ceil(sampleRate / 55);

  // Normalized Square Difference Function (NSDF) — better than raw autocorrelation
  const corr = new Float32Array(half);
  let norm = 0;
  for (let i = 0; i < half; i++) norm += buf[i] * buf[i] + buf[half + i] * buf[half + i];

  for (let lag = minLag; lag <= Math.min(maxLag, half - 1); lag++) {
    let sum = 0, div = 0;
    for (let i = 0; i < half; i++) {
      sum += buf[i] * buf[i + lag];
      div += buf[i] * buf[i] + buf[i + lag] * buf[i + lag];
    }
    corr[lag] = div > 0 ? 2 * sum / div : 0;
  }

  // Find first peak above 0.5 threshold after initial drop
  let d = minLag;
  while (d < maxLag && corr[d + 1] >= corr[d]) d++;

  let bestLag = -1, bestVal = 0.5;
  for (let i = d; i <= Math.min(maxLag, half - 2); i++) {
    if (corr[i] > bestVal && corr[i] >= corr[i - 1] && corr[i] >= corr[i + 1]) {
      bestVal = corr[i]; bestLag = i;
    }
  }
  if (bestLag < 2) return -1;

  // Parabolic interpolation for sub-sample accuracy
  const a = corr[bestLag - 1], b = corr[bestLag], c = corr[bestLag + 1];
  const denom = 2 * (2 * b - a - c);
  const refined = denom !== 0 ? bestLag + (c - a) / denom : bestLag;
  return sampleRate / refined;
}

function freqToNoteInfo(freq) {
  const midi = 69 + 12 * Math.log2(freq / 440);
  const midiRound = Math.round(midi);
  const cents = Math.round((midi - midiRound) * 100);
  const note = NOTE_NAMES[((midiRound % 12) + 12) % 12];
  const octave = Math.floor(midiRound / 12) - 1;
  return { note, octave, cents };
}

function nearestTunerString(freq) {
  let best = null, bestCents = Infinity;
  TUNER_STRINGS.forEach(st => {
    const cents = 1200 * Math.log2(freq / st.freq);
    if (Math.abs(cents) < Math.abs(bestCents)) { bestCents = cents; best = st; }
  });
  return { string: best, cents: Math.round(bestCents) };
}

function updateTunerUI(freq) {
  const noteEl    = document.getElementById('tunerNote');
  const octaveEl  = document.getElementById('tunerOctave');
  const centsEl   = document.getElementById('tunerCentsLabel');
  const needleEl  = document.getElementById('tunerNeedle');
  const hintEl    = document.getElementById('tunerStringHint');
  const statusEl  = document.getElementById('tunerStatus');

  if (freq < 0) {
    statusEl.textContent = T('tunerListening');
    noteEl.textContent = '—'; octaveEl.textContent = '';
    centsEl.textContent = ''; hintEl.textContent = '';
    needleEl.style.left = '50%';
    needleEl.classList.remove('in-tune');
    return;
  }

  statusEl.textContent = '';
  const { note, octave, cents } = freqToNoteInfo(freq);
  const { string, cents: strCents } = nearestTunerString(freq);

  noteEl.textContent = note;
  octaveEl.textContent = octave;

  const clampedCents = Math.max(-50, Math.min(50, cents));
  const pct = 50 + (clampedCents / 50) * 50;
  needleEl.style.left = pct + '%';

  const inTune = Math.abs(cents) <= 5;
  needleEl.classList.toggle('in-tune', inTune);
  centsEl.textContent = inTune ? T('inTune') : (cents > 0 ? `+${cents}` : `${cents}`) + ' cents';
  centsEl.style.color = inTune ? '#7fbf7a' : '';
  hintEl.textContent = string ? `${T('closest')} ${string.label}  (${strCents > 0 ? '+' : ''}${strCents} cents)` : '';
}

async function toggleTunerMic() {
  if (tunerRunning) { stopTunerMic(); return; }

  const btn = document.getElementById('tunerMicBtn');
  const statusEl = document.getElementById('tunerStatus');

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    statusEl.innerHTML = T('tunerUnsupported');
    return;
  }

  statusEl.textContent = T('micRequesting');
  btn.disabled = true;

  try {
    tunerStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
      video: false
    });
    btn.disabled = false;
    const ctx = resumeAudioSync();
    tunerSource = ctx.createMediaStreamSource(tunerStream);
    tunerAnalyser = ctx.createAnalyser();
    tunerAnalyser.fftSize = 8192;
    tunerAnalyser.smoothingTimeConstant = 0;
    tunerSource.connect(tunerAnalyser);
    tunerRunning = true;
    btn.textContent = T('tunerStop');
    btn.classList.add('active');
    statusEl.textContent = T('tunerListening');
    tunerLoop();
  } catch(e) {
    btn.disabled = false;
    btn.textContent = T('tunerStart');
    btn.classList.remove('active');
    if (e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError') {
      if (navigator.permissions) {
        navigator.permissions.query({ name: 'microphone' }).then(result => {
          if (result.state === 'denied') {
            statusEl.textContent = T('tunerDenied');
          } else {
            statusEl.textContent = T('micDismissed');
          }
        }).catch(() => {
          statusEl.textContent = T('tunerDenied');
        });
      } else {
        statusEl.textContent = T('tunerDenied');
      }
    } else if (e.name === 'NotFoundError') {
      statusEl.textContent = T('micNotFound');
    } else {
      statusEl.textContent = T('micError') + ': ' + e.message;
    }
  }
}

function stopTunerMic() {
  tunerRunning = false;
  if (tunerRaf) { cancelAnimationFrame(tunerRaf); tunerRaf = null; }
  if (tunerSource) { tunerSource.disconnect(); tunerSource = null; }
  if (tunerStream) { tunerStream.getTracks().forEach(t => t.stop()); tunerStream = null; }
  const btn = document.getElementById('tunerMicBtn');
  if (btn) { btn.textContent = T('tunerStart'); btn.classList.remove('active'); }
  updateTunerUI(-1);
}

function tunerLoop() {
  if (!tunerRunning) return;
  const buf = new Float32Array(tunerAnalyser.fftSize);
  tunerAnalyser.getFloatTimeDomainData(buf);

  // RMS check — only process if there's actual signal
  let rms = 0;
  for (let i = 0; i < buf.length; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / buf.length);

  if (rms > 0.005) {
    const freq = detectPitch(buf, getAudioCtx().sampleRate);
    updateTunerUI(freq);
  } else {
    updateTunerUI(-1);
  }
  tunerRaf = requestAnimationFrame(tunerLoop);
}

// ── INIT ───────────────────────────────────────────────────────────────────
buildDropdown();
rebuildCustomDropdown();
rebuildSeqDropdown();
buildFretboard();
render();
applyI18n();
</script>
